plugins {
    id 'com.android.application'
}

def googleServicesFile = file("google-services.json")
if (googleServicesFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def releaseSigningKeys = ["key.store", "key.store.password", "key.alias", "key.alias.password"]
def hasReleaseSigning = releaseSigningKeys.every { localProperties.getProperty(it) }

android {
    compileSdkVersion 36

    namespace "com.z.mas.portby.just6889"

    defaultConfig {
        applicationId "com.z.mas.portby.just6889"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 1757713338
        versionName "3.0.2"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(localProperties["key.store"])
                storePassword localProperties["key.store.password"]
                keyAlias localProperties['key.alias']
                keyPassword localProperties["key.alias.password"]
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            packaging {
                jniLibs {
                    useLegacyPackaging = true
                    excludes += [ "**/x86/*.so" ]
                    keepDebugSymbols = [ "**/*.so" ]
                }
            }
        }

        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            packaging {
                jniLibs {
                    useLegacyPackaging = true
                    excludes += [ "**/x86/*.so" ]
                }
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    androidResources {
        noCompress = [ 'ogv', 'avi', 'mpg', 'webm', 'mkv', 'mp4', 'mp3', 'mp2', 'ogg', 'opus', 'flac', 'rpyc', 'rpymc', 'rpyb', ]
    }

    aaptOptions {
        ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }
}

dependencies {
    implementation project(':renpyandroid')
    implementation "androidx.work:work-runtime:2.9.0"
    implementation 'com.google.android.material:material:1.13.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
